---
openapi: 3.1.0
info:
  title: Pickup lockers
  version: '1.0'
security:
- bearer: []
paths:
  "/v1/compartments":
    get:
      operationId: available
      parameters:
      - name: site
        in: query
        schema:
          type: string
      - name: size
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Available compartments
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Slot"
        default:
          description: Invalid input, authentication, ownership, availability or state
            error. Domain faults include a gRPC code and message.
  "/v1/reservations/{id}":
    get:
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Reservation"
        default:
          description: Invalid input, authentication, ownership, availability or state
            error. Domain faults include a gRPC code and message.
  "/v1/reservations":
    post:
      operationId: reserve
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - compartmentId
              properties:
                compartmentId:
                  type: string
      responses:
        '201':
          description: Reserved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Reservation"
          headers:
            Location:
              schema:
                type: string
        default:
          description: Invalid input, authentication, ownership, availability or state
            error. Domain faults include a gRPC code and message.
  "/v1/reservations/{id}/cancel":
    post:
      operationId: cancel
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Reservation"
        default:
          description: Invalid input, authentication, ownership, availability or state
            error. Domain faults include a gRPC code and message.
  "/v1/reservations/{id}/deposit":
    post:
      operationId: deposit
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Reservation"
        default:
          description: Invalid input, authentication, ownership, availability or state
            error. Domain faults include a gRPC code and message.
  "/v1/reservations/{id}/reissue":
    post:
      operationId: reissue
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Reservation"
        default:
          description: Invalid input, authentication, ownership, availability or state
            error. Domain faults include a gRPC code and message.
  "/v1/reservations/{id}/collect":
    post:
      operationId: collect
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Reservation"
        default:
          description: Invalid input, authentication, ownership, availability or state
            error. Domain faults include a gRPC code and message.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Reservation:
      type: object
      required:
      - id
      - state
      - compartmentId
      properties:
        id:
          type: string
        state:
          type: string
        compartmentId:
          type: string
    Slot:
      type: object
      required:
      - id
      - site
      - size
      properties:
        id:
          type: string
        site:
          type: string
        size:
          type: string
