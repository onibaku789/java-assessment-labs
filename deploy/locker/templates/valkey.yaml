apiVersion: v1
kind: Service
metadata: {name: valkey}
spec:
  selector: {app: valkey}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: valkey}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: valkey}}
  template:
    metadata: {labels: {app: valkey}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: valkey
          image: {{ .Values.valkeyImage | quote }}
          args: ["valkey-server","--save","","--appendonly","no"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {tcpSocket: {port: redis}, periodSeconds: 2}
          resources: {requests: {cpu: 25m, memory: 16Mi}, limits: {cpu: "1", memory: 128Mi}}
