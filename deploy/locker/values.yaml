imageTag: lab
restReplicas: 2
restReadinessPath: /actuator/health/readiness
autoscale: false
apps:
  directory:
    module: locker-directory-service
    env:
      LOCKER_GRPC_PORT: "9090"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xms48m -Xmx224m -XX:ActiveProcessorCount=2"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/lockers?currentSchema=directory"
      SPRING_DATASOURCE_USERNAME: "directory"
  reservations:
    module: reservation-service
    env:
      LOCKER_JWT_ISSUER: "urn:locker:lab"
      LOCKER_JWT_AUDIENCE: "locker-api"
      LOCKER_PICKUP_TTL: "15m"
      LOCKER_PICKUP_MAX_ATTEMPTS: "5"
      LOCKER_DIRECTORY: "directory:9090"
      LOCKER_DIRECTORY_DEADLINE: "2s"
      LOCKER_GRPC_PORT: "9090"
      LOCKER_OUTBOX_BATCH_SIZE: "50"
      LOCKER_OUTBOX_ACK_TIMEOUT: "12s"
      LOCKER_OUTBOX_POLL_INTERVAL: "300ms"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xms48m -Xmx224m -XX:ActiveProcessorCount=2"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/lockers?currentSchema=reservations"
      SPRING_DATASOURCE_USERNAME: "reservations"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"
      SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: "false"
      SPRING_KAFKA_LISTENER_ACK_MODE: "record"
  rest:
    module: locker-rest-api
    env:
      LOCKER_JWT_ISSUER: "urn:locker:lab"
      LOCKER_JWT_AUDIENCE: "locker-api"
      LOCKER_RESERVATIONS: "reservations:9090"
      LOCKER_RESERVATIONS_DEADLINE: "4s"
      LOCKER_CORS_ORIGINS: "http://localhost:18081,http://localhost:18082,http://localhost:18083"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xms48m -Xmx224m -XX:ActiveProcessorCount=2"
  graphql:
    module: locker-graphql-api
    env:
      LOCKER_JWT_ISSUER: "urn:locker:lab"
      LOCKER_JWT_AUDIENCE: "locker-api"
      LOCKER_RESERVATIONS: "reservations:9090"
      LOCKER_RESERVATIONS_DEADLINE: "4s"
      LOCKER_CORS_ORIGINS: "http://localhost:18081,http://localhost:18082,http://localhost:18083"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xms48m -Xmx224m -XX:ActiveProcessorCount=2"
  soap:
    module: locker-soap-api
    env:
      LOCKER_JWT_ISSUER: "urn:locker:lab"
      LOCKER_JWT_AUDIENCE: "locker-api"
      LOCKER_RESERVATIONS: "reservations:9090"
      LOCKER_RESERVATIONS_DEADLINE: "4s"
      LOCKER_CORS_ORIGINS: "http://localhost:18081,http://localhost:18082,http://localhost:18083"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xms48m -Xmx224m -XX:ActiveProcessorCount=2"
  notifications:
    module: notification-worker
    env:
      LOCKER_DELIVERY_RETRY_DELAY: "500ms"
      LOCKER_DELIVERY_RETRY_RETRIES: "3"
      LOCKER_MAIL_FROM: "lockers@example.test"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xms48m -Xmx224m -XX:ActiveProcessorCount=2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"
      SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: "false"
      SPRING_KAFKA_LISTENER_ACK_MODE: "record"
      SPRING_MAIL_HOST: "mailpit"
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: "5000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: "5000"
  receipts:
    module: receipt-worker
    env:
      LOCKER_DELIVERY_RETRY_DELAY: "500ms"
      LOCKER_DELIVERY_RETRY_RETRIES: "3"
      LOCKER_RECEIPTS_BUCKET: "locker-audit"
      LOCKER_STORAGE: "http://objects:9090"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xms48m -Xmx224m -XX:ActiveProcessorCount=2"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"
      SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: "false"
      SPRING_KAFKA_LISTENER_ACK_MODE: "record"
      AWS_ACCESS_KEY_ID: "lab"
      AWS_SECRET_ACCESS_KEY: "lab"
      AWS_REGION: "us-east-1"
