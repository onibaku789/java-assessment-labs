name: Locker CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      JDK_IMAGE: eclipse-temurin:25.0.5.1_2-jdk-noble@sha256:c7eef3dfeb81468533ea48c67bddaa8c7ca916454259e4d0d734d12bcff8e125
      COMPOSE_FILE: compose.yaml:deploy/verify.compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run JUnit and Testcontainers
        run: |
          docker run --rm --network host -v "$PWD:/src" -w /src -v locker-maven:/root/.m2 \
            -v /var/run/docker.sock:/var/run/docker.sock "$JDK_IMAGE" ./mvnw -B -ntp clean verify
      - name: Start locker services
        run: |
          ./scripts/lab-keys
          docker compose --env-file .lab/keys/database.env up -d --build
      - name: Verify all three protocols and both workers
        run: |
          docker run --rm --network host -v "$PWD:/src" -w /src -v locker-maven:/root/.m2 \
            "$JDK_IMAGE" ./mvnw -B -ntp -pl locker-verification -Dlocker.stack=true verify
      - name: Stop the CI deployment
        if: always()
        run: |
          if test -f .lab/keys/database.env; then docker compose --env-file .lab/keys/database.env down; fi
      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-reports
          path: |
            */target/surefire-reports/TEST-*.xml
            */target/failsafe-reports/TEST-*.xml
