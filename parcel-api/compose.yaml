name: parcel-study-api
services:
  db:
    image: postgres:19.0-alpine
    environment:
      POSTGRES_DB: parcels
      POSTGRES_USER: learner
      POSTGRES_PASSWORD: local-parcels
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learner -d parcels"]
      interval: 2s
      timeout: 2s
      retries: 30
