<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Parcel tracking</title>
<h1>Track a parcel</h1>
<form><label>Tracking ID <input id="tracking" value="P-100"></label>
<label>Local test bearer <input id="bearer" type="password" autocomplete="off"></label>
<button>Track</button></form><pre id="result" aria-live="polite"></pre>
<script>
document.querySelector("form").onsubmit = async event => {
  event.preventDefault();
  const headers = bearer.value ? {Authorization: "Bearer " + bearer.value} : {};
  try {
    const response = await fetch("http://127.0.0.1:18081/parcels/" +
      encodeURIComponent(tracking.value), {headers});
    result.textContent = response.status + " " + await response.text();
  } catch (error) { result.textContent = String(error); }
};
</script></html>
