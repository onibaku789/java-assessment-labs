spring.liquibase.change-log=classpath:db/changelog.sql
management.endpoint.health.probes.enabled=true
spring.datasource.hikari.maximum-pool-size=8
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=${LOCKER_KAFKA_MAX_BLOCK_MS:3000}
spring.kafka.producer.properties.delivery.timeout.ms=${LOCKER_KAFKA_DELIVERY_TIMEOUT_MS:10000}
spring.kafka.producer.properties.request.timeout.ms=${LOCKER_KAFKA_REQUEST_TIMEOUT_MS:3000}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

locker.pickup.ttl=15m
locker.pickup.max-attempts=${LOCKER_PICKUP_MAX_ATTEMPTS:5}
locker.directory.deadline=2s
locker.outbox.batch-size=${LOCKER_OUTBOX_BATCH_SIZE:50}
locker.outbox.ack-timeout=${LOCKER_OUTBOX_ACK_TIMEOUT:12s}
locker.outbox.poll-interval=${LOCKER_OUTBOX_POLL_INTERVAL:300ms}
